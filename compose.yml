# Production stack (local and EC2): nginx serves the React build on http://localhost:${CLIENT_PORT:-3000}
# and proxies /superverse, /createorjoinuser and /socket.io to the Node server.
# Requires .env (DATABASE = Atlas URI) and serviceAccount.json at the repo root.
services:
  server:
    build: .
    env_file: .env
    environment:
      PORT: "5001"
    volumes:
      - ./serviceAccount.json:/app/serviceAccount.json:ro
    restart: unless-stopped

  client:
    build:
      context: ./client
      target: prod
    ports:
      - "${CLIENT_PORT:-3000}:80"   # set CLIENT_PORT=80 in .env on EC2
    depends_on:
      - server
    restart: unless-stopped
